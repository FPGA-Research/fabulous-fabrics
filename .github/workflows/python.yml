name: Python package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: astral-sh/setup-uv@v7
    - run: uv sync --locked
    - run: uv run pytest
    - run: uv build
