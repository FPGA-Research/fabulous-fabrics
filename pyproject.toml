[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "fabulous-fabrics"
dynamic = ["version"]
description = "Fabric definitions and project skeletons for the FABulous FPGA fabric generator"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["fabulous-tiles", "pydantic>=2", "pyyaml>=6"]

# The fabric registry in fabulous_fabrics.registry reads this group, so another
# package can add fabrics by declaring it too.
[project.entry-points."fabulous.fabrics"]
fabulous-fabrics = "fabulous_fabrics.registry:FABRICS_ROOT"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
fabulous-tiles = { git = "https://github.com/FPGA-Research/fabulous-tiles.git", rev = "b7bdb6a5b6e86e802f5541ea3c49aa5930e35517" }

# The version comes from the git tag. A build without git history, such as a Nix
# fetchGit source, falls back to the last release, which release-please bumps.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

# fabulous_fabrics/fabrics is a symlink to the top-level fabrics/, which stays there
# because the LibreLane Makefile and CI address it. Hatchling copies the target, and
# the VCS ignore filter would drop a gitignored asset such as a *.json file.
[tool.hatch.build.targets.wheel]
packages = ["fabulous_fabrics"]
ignore-vcs = true
exclude = ["**/runs", "**/macro", "**/__pycache__"]

[tool.hatch.build.targets.sdist]
only-include = ["fabulous_fabrics", "README.md"]
ignore-vcs = true
exclude = ["**/runs", "**/macro", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
